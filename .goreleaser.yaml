version: 2

project_name: webshare

builds:
  - binary: webshare
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/webshare-proxy/webshare-cli/internal/cmd.version=v{{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: webshare
    repository:
      owner: webshare-proxy
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/webshare-proxy/webshare-cli
    description: Official command-line interface for the Webshare proxy API
    # The binaries are not notarized; clear the quarantine attribute so
    # Gatekeeper does not block them (standard cask hook for unsigned Go
    # binaries).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/webshare"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
